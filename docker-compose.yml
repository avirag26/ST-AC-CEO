services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: st-ac-ceo
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
